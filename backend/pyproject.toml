[project]
name = "nyaya-sahayak-backend"
version = "0.1.0"
description = "Backend for Nyaya Sahayak - GenAI Legal Assistance Tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "google-genai>=1.50.0",
    "spacy>=3.7.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "Pillow>=10.2.0",
    "slowapi>=0.1.9",
    "markdown>=3.5.0",
    "tenacity>=8.2.0",
]

[tool.vercel]
entrypoint = "main.py"


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint subset
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN401",  # dynamically typed expressions (typing.Any)
    "S101",    # assert used (ok in tests)
    "E501",    # line too long
    "S110",    # try-except-pass
    "E402",    # module level import not at top of file (for serverless sys.path)
    "PLR0913", # too many arguments to function (acceptable for service methods)
    "PLR2004", # magic value used in comparison (acceptable for config validators)
    "RET504",  # unnecessary assignment before return
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
